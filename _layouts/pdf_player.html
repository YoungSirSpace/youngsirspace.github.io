<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{{ page.title }}</title>
    <link rel="icon" href="https://youngsirspace.github.io/favicon.ico">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #333; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <iframe id="pdf-frame" src=""></iframe>

<script>
  window.onload = function() {
    const params = new URLSearchParams(window.location.search);
    let fileUrl = params.get('file');
    
    if (fileUrl) {
      fileUrl = encodeURI(decodeURI(fileUrl)); 
      console.log("Loading PDF from:", fileUrl); // 可以在浏览器 F12 控制台查看路径是否正确
      document.getElementById('pdf-frame').src = fileUrl;
    } else {
      alert("No PDF file specified!");
    }
  };
</script>
</body>
</html>
